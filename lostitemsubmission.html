        <h1 class="p-4">Report Lost Item</h1>
        <form method="POST" action="submit_lost_item.php" enctype="multipart/form-data">
            <label for="item">Item:</label>
            <input type="text" id="item" name="item" placeholder="Item" required>

            <label for="details">Details:</label>
            <input type="details" name="details" placeholder="Details (Describe the item specifically Ex. Color, Size, Brand, etc.)" required>

            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Email" required>

            <label for="phone">Phone No.:</label>
            <input type="text" id="phone" name="phone" placeholder="Phone No." required>

            <label for="datelost">Date Lost:</label>
            <input type="datetime-local" id="datelost" name="datelost" required>

            <label for="image">Upload Image:</label>
            <input type="file" id="image" name="image" accept="image/*">

            <label for="notes">Notes:</label>
            <textarea id="notes" name="notes" placeholder="Additional Notes"></textarea>
            
            <input class="my-3 p-2" type="submit" name="submitlostitem" value="Submit Lost Item">
            
        </form>
